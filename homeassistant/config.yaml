# Home Assistant add-on: Papigator server (one container – web app, API, OCR, scanner inbox, backups).
# Version erhöhen, wenn ein neuer Server-Stand ausgeliefert werden soll – HA baut das Add-on erst dann neu.
# Dieselbe Version steht in build.yaml als Image-Tag (die öffentliche Action taggt das Image damit; ci/ha-addon-check.sh
# prüft, dass beide gleich sind).
name: Papigator
version: "2026.11.25"
slug: papigator
description: Self-hosted document archive – OCR, full-text search, deadlines, optional local AI
url: https://github.com/donsebby/papigator-server
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
# HA hält das Add-on fürs Backup kurz an: eine SQLite-Datenbank im laufenden Betrieb zu kopieren kann eine kaputte
# Sicherung ergeben (WAL)
backup: cold
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: Web app and API (also used by the iPhone/iPad app)
webui: http://[HOST]:[PORT:8000]/app
watchdog: http://[HOST]:[PORT:8000]/ping
map:
  - share:rw
options:
  setup_token: ""
  secret_key: ""
  inbox_dir: /share/papigator/inbox
  backup_dir: ""
  llm_url: ""
  llm_model: gemma4:e4b
schema:
  setup_token: password
  secret_key: password?
  inbox_dir: str
  backup_dir: str?
  llm_url: str?
  llm_model: str?
