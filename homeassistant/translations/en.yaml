configuration:
  setup_token:
    name: Setup token
    description: Required. Any long random string. Enter it once in the web app under "Ersteinrichtung" (first-run setup) to create the first admin; it stops working as soon as a user exists.
  secret_key:
    name: Secret key
    description: Recommended (e.g. openssl rand -base64 32), keep a copy in your password manager – a restored backup needs the same key for stored mail passwords and share link addresses. Empty – Papigator creates one in the add-on data. Do not change it later.
  inbox_dir:
    name: Scanner inbox
    description: Folder Papigator imports from – one subfolder per user (lower-case username). Under /share it is reachable via the Samba add-on.
  backup_dir:
    name: Backup folder
    description: Optional, e.g. /share/papigator/backup – nightly snapshots (03:00), unencrypted and readable via Samba. Empty (default) – no extra backup; the add-on data is part of Home Assistant backups.
  llm_url:
    name: AI server URL
    description: Optional, OpenAI-compatible API, e.g. Ollama at http://192.0.2.10:11434/v1. Empty – no AI. Can also be set later in the web app.
  llm_model:
    name: AI model
    description: Model name on the AI server.
network:
  8000/tcp: Web app and API (also used by the iPhone/iPad app)
