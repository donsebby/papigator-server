# Papigator – self-hosted document archive
#
#   cp .env.example .env      # then fill in PAPIGATOR_SECRET_KEY and PAPIGATOR_TOKEN
#   docker compose up -d
#   open http://<host>:8000/app
#
# Uses the prebuilt image from PAPIGATOR_IMAGE (see .env.example); `docker compose up -d --build`
# builds it from this folder instead.

x-papigator: &papigator
  image: ${PAPIGATOR_IMAGE:-papigator-server:local}
  restart: unless-stopped
  env_file: .env
  environment: &env
    PAPIGATOR_DATA: /data
    PAPIGATOR_BACKUP: /backup
    PUID: ${PUID:-1000}
    PGID: ${PGID:-1000}
    TZ: ${TZ:-Etc/UTC}
    # Both services must share the same key – refuse to start without it
    PAPIGATOR_SECRET_KEY: ${PAPIGATOR_SECRET_KEY:?set PAPIGATOR_SECRET_KEY in .env (openssl rand -base64 32)}
  security_opt:
    - no-new-privileges:true

services:
  papigator:
    <<: *papigator
    build: .
    container_name: papigator
    environment:
      <<: *env
      # Only used for the first-run setup (creating the first admin); ignored once a user exists
      PAPIGATOR_TOKEN: ${PAPIGATOR_TOKEN:?set PAPIGATOR_TOKEN in .env (any long random string)}
    ports:
      - "${PAPIGATOR_PORT:-8000}:8000"
    volumes:
      - ./data:/data        # database, PDFs, thumbnails, scanner inbox (data/inbox/<username>/)
      - ./backup:/backup    # nightly snapshots – ideally a NAS folder or a second disk
    # Lets PAPIGATOR_LLM_URL=http://host.docker.internal:11434/v1 reach Ollama running on the Docker host
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Public share pages (/s/… only: share links and upload boxes). This is the ONLY port that should
  # ever be reachable from the internet, through a reverse proxy with HTTPS. Remove this service if
  # you don't share documents with people outside your network.
  papigator-share:
    <<: *papigator
    container_name: papigator-share
    command: ["uvicorn", "app.share_app:app", "--host", "0.0.0.0", "--port", "8001", "--no-server-header"]
    environment:
      <<: *env
      PAPIGATOR_BACKUP: ""
    ports:
      - "${PAPIGATOR_SHARE_PORT:-8001}:8001"
    volumes:
      - ./data:/data        # read-write: upload boxes store incoming files here
    depends_on:
      papigator:
        condition: service_healthy   # the main service creates and migrates the database
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/s/_/ping', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    # Upload boxes accept files from strangers: a malicious PDF or image may at most restart this container
    mem_limit: 768m
    pids_limit: 64

  # Optional: local AI on the same machine (CPU only unless you add GPU access).
  # Then set PAPIGATOR_LLM_URL=http://ollama:11434/v1 and pull a model once:
  #   docker compose exec ollama ollama pull gemma4:e4b
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: papigator-ollama
  #   restart: unless-stopped
  #   volumes:
  #     - ./ollama:/root/.ollama
