name: Docker image
# Builds the image, starts it the way the README does (docker compose, empty folders) and checks first-run
# setup, OCR, thumbnails, the web app and the share service (ci/docker-smoke.sh). Only then is it pushed to
# the GitHub Container Registry: ghcr.io/<owner>/papigator:latest and :sha-<short>
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: papigator-server:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start and check the image
        run: ci/docker-smoke.sh
        env:
          PAPIGATOR_IMAGE: papigator-server:local
      - name: Check the Unraid template
        run: ci/unraid-template-check.sh
        env:
          PAPIGATOR_IMAGE: papigator-server:local
      - name: Check the Home Assistant add-on
        run: ci/ha-addon-check.sh
        env:
          PAPIGATOR_IMAGE: papigator-server:local

  image:
    needs: smoke
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # ghcr.io requires a lower-case name
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${OWNER,,}/papigator" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Home Assistant add-on builds on the image tagged with its version (homeassistant/build.yaml)
      - name: Add-on version
        id: addon
        run: |
          v=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' homeassistant/config.yaml)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.addon.outputs.version }},enable=${{ github.ref == 'refs/heads/main' && steps.addon.outputs.version != '' }}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
